version: "2"

linters:
  default: standard
  enable:
    - unparam
    - unconvert
    - wastedassign
    - errorlint
    - nilerr
    - nilnesserr
    - forcetypeassert
    - makezero
    - reassign
    - recvcheck
    - predeclared
    - modernize
    - gocritic
    - revive
    - usestdlibvars
    - intrange
    - errname
    - paralleltest
    - tparallel
    - thelper
  settings:
    revive:
      # revive's default set minus `exported` and `package-comments` (both
      # demand the comments tools/nocomments exists to forbid) and
      # `package-naming` (a rule package's name tracks the snake_case directory
      # lintcn discovers it by).
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    rules:
      # isDirective is copied verbatim from go/ast so it can be re-diffed when
      # Go changes it; a De Morgan rewrite would make that diff meaningless.
      - path: tools/nocomments/nocomments.go
        text: 'QF1001'

formatters:
  enable:
    - gofmt
    - goimports
